[package]
name = "ellie_core_native"
version = "0.3.0"
edition = "2021"
description = "Native Rust implementations for the Ellie Core Library"

[lib]
crate-type = ["cdylib"]

[dependencies]
ellie_native_bridge = { path = "../../EllieNativeBridge", features = ["rust_bridge"] }
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
